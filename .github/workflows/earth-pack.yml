name: Earth pack

# The global Earth pack (docs/REAL_EARTH_PLAN.md section 2, stage E5), built only when asked. The sources are fetched
# once into the Actions cache, GRIP's roads filed by 10-degree block (tools/earth2 split-grip: a part reads its blocks'
# files alone, and the cache stays well under its 10 GB). The world is built in parts of 10 degrees by the width asked,
# on a matrix, with the global tables beside them. One job then indexes the parts into a pack that verifies, puts it in zips under 2 GB
# (tools/earth2 package), keeps them as the run's artifacts and, when a release is named, attaches them to it (making it
# first when it isn't there: the game's installer, src/earth_install.h, reads the release "earth").
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the pack to this release, made when it isn't there (the game's installer reads \"earth\"; empty: the run's artifacts only)"
        required: false
        default: ""
      part_width:
        description: "Degrees of longitude per part (each 10 degrees of latitude)"
        type: choice
        options: ["30", "60", "90", "120"]
        default: "60"
      refresh_sources:
        description: "Fetch the sources again (a new cache entry)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: earth-pack
  cancel-in-progress: false

env:
  ETOPO: ETOPO_2022_v1_30s_N90W180_surface.tif
  CGLS: PROBAV_LC100_global_v3.0.1_2019-nrt_Discrete-Classification-map_EPSG-4326.tif

jobs:
  sources:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
      - id: key   # (a refresh makes an entry of its own; the old one ages out of the cache)
        run: echo "key=earth-sources-v2${{ inputs.refresh_sources && format('-{0}', github.run_id) || '' }}" >> "$GITHUB_OUTPUT"
      - id: plan
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          w = int("${{ inputs.part_width }}")
          name = lambda s, x: "%s%02d%s%03d" % ("N" if s >= 0 else "S", abs(s), "E" if x >= 0 else "W", abs(x))
          parts = [{"name": name(s, x), "box": "%d %d %d %d" % (s, x, s + 10, x + w)} for s in range(-90, 90, 10) for x in range(-180, 180, w)]
          print("parts=" + json.dumps(parts))
          EOF
      - id: have
        uses: actions/cache/restore@v4
        with:
          path: sources
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Room for the sources   # (the runner's preinstalled SDKs the build never uses)
        if: steps.have.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Fetch the sources
        if: steps.have.outputs.cache-hit != 'true'
        run: |
          mkdir -p sources
          get() { curl -fL --retry 5 --retry-delay 30 --retry-all-errors -o "sources/$1" "$2"; ls -la "sources/$1"; }
          get "$ETOPO" "https://www.ngdc.noaa.gov/mgg/global/relief/ETOPO2022/data/30s/30s_surface_elev_gtif/$ETOPO"
          get "$CGLS" "https://zenodo.org/records/3939050/files/$CGLS?download=1"
          for r in 1 2 3 4 5 6 7; do get "GRIP4_Region${r}_vector_shp.zip" "https://dataportaal.pbl.nl/downloads/GRIP4/GRIP4_Region${r}_vector_shp.zip"; done
          get airports.csv https://davidmegginson.github.io/ourairports-data/airports.csv
          get runways.csv https://davidmegginson.github.io/ourairports-data/runways.csv
          get cities500.zip https://download.geonames.org/export/dump/cities500.zip
          python3 -c "from tools.earth2 import glo90; glo90.write_listing('sources/glo90_listing.txt', glo90.list_bucket())"
          wc -l sources/glo90_listing.txt
      - name: File GRIP's roads by block
        if: steps.have.outputs.cache-hit != 'true'
        run: |
          python3 -m tools.earth2 split-grip --out sources/grip-blocks sources/GRIP4_Region*_vector_shp.zip
          rm sources/GRIP4_Region*_vector_shp.zip
          du -sh sources sources/*
      - if: steps.have.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: sources
          key: ${{ steps.key.outputs.key }}

  tables:   # the airports, the places and the GLO-90 bitmap: global, one part
    needs: sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: sources
          key: ${{ needs.sources.outputs.key }}
          fail-on-cache-miss: true
      - name: Build
        run: |
          python3 -m tools.earth2 build --out part --box -90 -180 90 180 --part tables --only tables,glo90 \
            --airports sources/airports.csv --runways sources/runways.csv --places sources/cities500.zip \
            --glo90-listing sources/glo90_listing.txt
      - uses: actions/upload-artifact@v4
        with:
          name: earth-part-tables
          path: part
          retention-days: 2
          compression-level: 0

  part:   # elevation, cover and roads (main and local) for one box of whole 10-degree blocks
    needs: sources
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 16   # (the rest of the account's runners left to the pushes' builds)
      matrix:
        part: ${{ fromJSON(needs.sources.outputs.parts) }}
    steps:
      - name: Room for the sources   # (the runner's preinstalled SDKs the build never uses)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - uses: actions/cache/restore@v4
        with:
          path: sources
          key: ${{ needs.sources.outputs.key }}
          fail-on-cache-miss: true
      - name: Build ${{ matrix.part.name }}
        run: |
          python3 -m tools.earth2 build --out part --box ${{ matrix.part.box }} --part ${{ matrix.part.name }} --only rasters,roads \
            --etopo "sources/$ETOPO" --cover "sources/$CGLS" --grip-blocks sources/grip-blocks --local-roads
      - uses: actions/upload-artifact@v4
        with:
          name: earth-part-${{ matrix.part.name }}
          path: part
          retention-days: 2
          compression-level: 0

  pack:
    needs: [tables, part]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: earth-part-*
          path: earth
          merge-multiple: true
      - name: Index and verify
        run: |
          python3 -m tools.earth2 index earth
          python3 -m tools.earth2 verify earth
          du -sh earth/*
      - name: Package
        run: python3 -m tools.earth2 package earth dist && cat dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: earth-pack
          path: dist
          retention-days: 7
          compression-level: 0
      - name: Attach to ${{ inputs.release_tag }}
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.release_tag }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "The real Earth (data pack)" \
              --notes "The real Earth's data pack. The game installs its first zip, the core (the index, the airports, the places), from its Free Flight screen and streams the land from the others as it is flown; or downloads them all, to fly with no connection. Built by the Earth pack workflow from ETOPO 2022, Copernicus GLO-90 (fetched as flown), CGLS-LC100, GRIP4, OurAirports and GeoNames; their licences are in the pack's licenses folder."
          # (the zips are named for the pack they hold: the last pack's are kept - a streamed copy of it reads from
          # them until it is got again - and any before that removed)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --output prev.sums 2>/dev/null || : > prev.sums
          gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          keep=$(awk '{print $2}' prev.sums dist/SHA256SUMS | sort -u)
          for asset in $(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
            case "$asset" in
              earth-pack-*.zip) echo "$keep" | grep -qxF "$asset" || gh release delete-asset "$tag" "$asset" --yes --repo "$GITHUB_REPOSITORY" ;;
            esac
          done
