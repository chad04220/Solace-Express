name: Offline Earth sampling

on:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'tools/earth/**'
      - 'tools/usgs_world_map/**'
      - 'tests/earth_pack_test.py'
      - 'tests/earth_sampling_test.py'
      - 'tests/usgs_world_map_test.py'
      - 'tests/fixtures/earth/**'
      - '.github/workflows/earth-sampling.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'tools/earth/**'
      - 'tools/usgs_world_map/**'
      - 'tests/earth_pack_test.py'
      - 'tests/earth_sampling_test.py'
      - 'tests/usgs_world_map_test.py'
      - 'tests/fixtures/earth/**'
      - '.github/workflows/earth-sampling.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sampler-contracts:
    name: Sampling contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install explicit optional test dependencies
        run: python -m pip install --disable-pip-version-check -r tools/earth/requirements-numpy.txt
      - name: Test accelerated sampling (dependency required)
        run: python tests/earth_sampling_test.py --require-numpy
      - name: Test portable sampler without site packages
        run: python -S tests/earth_sampling_test.py PortableSamplerTests
      - name: Test existing pack contracts
        run: python tests/earth_pack_test.py
      - name: Test existing source-handoff contracts
        run: python tests/usgs_world_map_test.py
