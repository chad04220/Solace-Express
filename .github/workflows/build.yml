name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub Release with this tag (e.g. v1.0). Leave empty to just build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC)
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (flight model + campaign progression)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/AirXpress | Out-Null
          Copy-Item build/Release/AirXpress.exe dist/AirXpress/
          Copy-Item README.md, radio_stations.txt, THIRD_PARTY_NOTICES.md, render_shots.bat, benchmark.bat dist/AirXpress/
          Compress-Archive -Path dist/AirXpress/* -DestinationPath dist/AirXpress-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: AirXpress-windows-x64
          path: dist/AirXpress/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Air Xpress ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/AirXpress-windows-x64.zip
