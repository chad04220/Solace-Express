name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub Release with this tag (e.g. v1.0). Leave empty to just build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  linux-sanitizers:   # every headless test under AddressSanitizer + UBSan (the shader checks need a validator: skipped)
    runs-on: ubuntu-latest
    if: inputs.release_tag == ''
    steps:
      - uses: actions/checkout@v4
      - name: Configure (GCC, ASan + UBSan)
        run: cmake -S . -B build -DSANITIZE=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build --parallel 4 --target flight_test progression_test save_test airport_layout_test envelope_test hull_test entity_raycast_test gameplay_test shader_keyword_test
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure -E "shader_glsl|terrain_shadow_bake"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC)
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (flight model + campaign progression)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/SolaceExpress | Out-Null
          Copy-Item build/Release/SolaceExpress.exe dist/SolaceExpress/
          Copy-Item README.md, radio_stations.txt, THIRD_PARTY_NOTICES.md, render_shots.bat, benchmark.bat, profile.bat, analyze.bat, render_loading.bat, render_menu.bat dist/SolaceExpress/
          New-Item -ItemType Directory -Force -Path dist/SolaceExpress/loading | Out-Null
          Copy-Item assets/loading/*.jpg dist/SolaceExpress/loading/
          Copy-Item -Recurse assets/voice dist/SolaceExpress/voice
          if (Test-Path assets/menu.mp4) { Copy-Item assets/menu.mp4 dist/SolaceExpress/ }   # the pre-rendered menu montage (render_menu.bat)
          Compress-Archive -Path dist/SolaceExpress/* -DestinationPath dist/SolaceExpress-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: SolaceExpress-windows-x64
          path: dist/SolaceExpress/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Solace Express ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md   # what's new (kept up to date before each release); the generated changelog follows
          generate_release_notes: true
          files: dist/SolaceExpress-windows-x64.zip
