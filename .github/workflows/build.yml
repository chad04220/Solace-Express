name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC)
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (flight model + campaign progression)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/AirXpress | Out-Null
          Copy-Item build/Release/AirXpress.exe dist/AirXpress/
          Copy-Item README.md, radio_stations.txt, THIRD_PARTY_NOTICES.md dist/AirXpress/
          Compress-Archive -Path dist/AirXpress/* -DestinationPath dist/AirXpress-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: AirXpress-windows-x64
          path: dist/AirXpress/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AirXpress-windows-x64.zip
