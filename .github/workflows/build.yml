name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub Release with this tag (e.g. v1.0). Leave empty to just build."
        required: false
        default: ""

permissions:
  contents: write

# A newer push to the same branch cancels the run still going for the last one; a manual run (a release) is in a group
# of its own and is never cancelled
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  linux-sanitizers:   # every headless test under AddressSanitizer + UBSan (the shader checks need a validator: skipped); a release waits for it
    # (a pull request from a branch of this repository: its push already runs the same commit)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1500M
    steps:
      - uses: actions/checkout@v4
      - name: Compiler cache
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache
      - uses: actions/cache@v4   # the last run's compiled files: a push recompiles only what it changed
        with:
          path: .ccache
          key: ccache-sanitize-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-sanitize-${{ github.ref_name }}-
            ccache-sanitize-
      - name: Configure (GCC, ASan + UBSan)
        run: cmake -S . -B build -DSANITIZE=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          ccache -z
          cmake --build build --parallel 4 --target flight_test progression_test save_test airport_layout_test envelope_test hull_test mesh_simplify_test entity_raycast_test gameplay_test encounter_timing_test shader_keyword_test world_cache_test aero_test aero_wake_test breakup_test
          ccache -s
      - name: Test   # four at a time: the runner's four cores (the flight model, the longest, sets the time)
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
          FLIGHT_QUICK: 1   # (the flight model's type-by-type checks on one of each kind of aircraft: the Windows job flies them all)
        run: ctest --test-dir build --output-on-failure -j4 -E "shader_glsl|terrain_shadow_bake"

  windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC)
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (flight model + campaign progression)
        run: ctest --test-dir build -C Release --output-on-failure -j4

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/SolaceExpress | Out-Null
          Copy-Item build/Release/SolaceExpress.exe dist/SolaceExpress/
          Copy-Item README.md, LICENSE, radio_stations.txt, THIRD_PARTY_NOTICES.md, diagnostics.bat dist/SolaceExpress/
          Set-Content -Path dist/SolaceExpress/VERSION.txt -Value "${{ inputs.release_tag || github.ref_name }}"
          New-Item -ItemType Directory -Force -Path dist/SolaceExpress/loading | Out-Null
          Copy-Item assets/loading/*.jpg dist/SolaceExpress/loading/
          New-Item -ItemType Directory -Force -Path dist/SolaceExpress/materials | Out-Null
          Copy-Item -Recurse assets/materials/* dist/SolaceExpress/materials/
          Copy-Item -Recurse assets/voice dist/SolaceExpress/voice
          if (Test-Path assets/menu.mp4) { Copy-Item assets/menu.mp4 dist/SolaceExpress/ }   # the pre-rendered menu montage (diagnostics.bat menu)
          Compress-Archive -Path dist/SolaceExpress/* -DestinationPath dist/SolaceExpress-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: SolaceExpress-windows-x64
          path: dist/SolaceExpress/

      - uses: actions/upload-artifact@v4
        with:
          name: SolaceExpress-windows-x64-zip
          path: dist/SolaceExpress-windows-x64.zip

  release:   # only once the same source has passed on Windows and under the Linux sanitizers
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [linux-sanitizers, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: SolaceExpress-windows-x64-zip
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Solace Express ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md   # what's new (kept up to date before each release); the generated changelog follows
          generate_release_notes: true
          files: dist/SolaceExpress-windows-x64.zip
